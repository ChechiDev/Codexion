name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  norminette:
    name: Norminette
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install norminette
        run: pip install norminette==3.3.60

      # The subject delivers Makefile, *.c and *.h in coders/: every .c/.h there is checked.
      - name: Run norminette on coders/
        run: |
          if [ -z "$(find coders -name '*.[ch]' 2>/dev/null)" ]; then
            echo "No C sources in coders/ yet: nothing to check."
            exit 0
          fi
          norminette coders/

  build-test:
    name: Build, tests, valgrind, TSan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Shared runners are slower and noisier than a local machine: timing
      # assertions in simulation tests get this extra slack (local default: 0).
      CODEXION_TIME_SLACK_MS: "40"
    steps:
      - uses: actions/checkout@v4

      # Acceptance tests run norminette themselves (Norm is part of the subject).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install norminette
        run: pip install norminette==3.3.60

      # The Azure apt mirror sometimes stalls on libc6-dbg (a valgrind dependency):
      # keep the downloaded .debs in the Actions cache so most runs skip the network.
      - name: Restore valgrind packages
        id: valgrind-cache
        uses: actions/cache@v4
        with:
          path: ~/valgrind-debs
          key: valgrind-debs-${{ runner.os }}-noble-v1

      - name: Install valgrind
        timeout-minutes: 8
        env:
          CACHE_HIT: ${{ steps.valgrind-cache.outputs.cache-hit }}
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          if [ "$CACHE_HIT" = true ]; then
            if sudo dpkg -i ~/valgrind-debs/*.deb; then valgrind --version; exit 0; fi
            echo "cached packages no longer match this image: downloading again"
            sudo apt-get install -f -y
          fi
          APT_OPTS="-o Acquire::Retries=2 -o Acquire::http::Timeout=20"
          for attempt in 1 2 3; do
            # Retries go to the main Ubuntu archive instead of the stalled mirror.
            if [ "$attempt" -gt 1 ]; then
              echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            fi
            echo "::group::apt attempt $attempt"
            if timeout 120 sudo apt-get $APT_OPTS update \
              && timeout 150 sudo apt-get $APT_OPTS install -y --no-install-recommends valgrind; then
              echo "::endgroup::"
              mkdir -p ~/valgrind-debs
              cp /var/cache/apt/archives/valgrind_*.deb /var/cache/apt/archives/libc6-dbg_*.deb ~/valgrind-debs/
              valgrind --version
              exit 0
            fi
            echo "::endgroup::"
            echo "apt attempt $attempt failed, retrying in 10 s"
            sleep 10
          done
          echo "::error::could not install valgrind after 3 attempts"
          exit 1

      # harness/ is a local symlink: run the tooling targets, not `make check`.
      - name: Build + no relink + tests
        run: make verify

      - name: Valgrind (leaks, memory errors)
        run: make memcheck

      - name: ThreadSanitizer (data races)
        run: make tsan
