name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  norminette:
    name: Norminette
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install norminette
        run: pip install norminette==3.3.60

      # The subject delivers Makefile, *.c and *.h in coders/: every .c/.h there is checked.
      - name: Run norminette on coders/
        run: |
          if [ -z "$(find coders -name '*.[ch]' 2>/dev/null)" ]; then
            echo "No C sources in coders/ yet: nothing to check."
            exit 0
          fi
          norminette coders/

  build-test:
    name: Build, tests, valgrind, TSan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Shared runners are slower and noisier than a local machine: timing
      # assertions in simulation tests get this extra slack (local default: 0).
      CODEXION_TIME_SLACK_MS: "40"
    steps:
      - uses: actions/checkout@v4

      # Hosted-runner apt mirrors stall now and then: bound every network wait,
      # retry the whole install, and skip the slow man-db trigger.
      - name: Install valgrind
        timeout-minutes: 8
        run: |
          echo 'set man-db/auto-update false' | sudo debconf-communicate >/dev/null
          sudo rm -f /var/lib/man-db/auto-update
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          for attempt in 1 2 3; do
            echo "::group::apt attempt $attempt"
            if timeout 120 sudo apt-get $APT_OPTS update \
              && timeout 120 sudo apt-get $APT_OPTS install -y --no-install-recommends valgrind; then
              echo "::endgroup::"
              valgrind --version
              exit 0
            fi
            echo "::endgroup::"
            echo "apt attempt $attempt failed, retrying in 10 s"
            sleep 10
          done
          echo "::error::could not install valgrind after 3 attempts"
          exit 1

      # harness/ is a local symlink: run the tooling targets, not `make check`.
      - name: Build + no relink + tests
        run: make verify

      - name: Valgrind (leaks, memory errors)
        run: make memcheck

      - name: ThreadSanitizer (data races)
        run: make tsan
